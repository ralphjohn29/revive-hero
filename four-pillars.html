*{margin:0;padding:0;box-sizing:border-box}

.deck-note a{color:var(--gold)}

@media (max-width:1080px){.stage{flex-direction:column;align-items:center}}
.browser{flex:1;min-width:0;background:#26231f;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}

/* ============ SECTION: PROOF STRIP + FOUR PILLARS ============ */

/* proof strip */
.proof{display:flex;align-items:center;justify-content:center;gap:1.2rem;flex-wrap:wrap;
  background:var(--taupe);border-radius:4px;padding:1.1rem 1.6rem;margin-bottom:3rem;

/* section head */

.p-eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:1rem}

/* pillars grid */

.pillar{background:var(--paper);border:1px solid var(--taupe);border-radius:4px;padding:2rem 1.8rem}
.pillar .num{font-family:'DM Serif Display',serif;font-size:2.2rem;color:var(--gold);line-height:1}

.pillar p{font-size:.9rem;font-weight:300;line-height:1.75;color:var(--ink60)}

  .pillars{grid-template-columns:1fr}
